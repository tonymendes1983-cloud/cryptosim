<style>
:root{
  --bg:#0f1512; --panel:#151d19; --panel2:#1b2520; --line:#26312b;
  --ink:#efe9da; --mut:#89958c; --acc:#ffd23f; --up:#4fd68a; --down:#ff6a55;
  --sans:"Archivo","Segoe UI",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:16px}
body{display:flex;flex-direction:column;max-width:600px;margin:0 auto;border-left:1px solid var(--line);border-right:1px solid var(--line)}
button,input{font-family:inherit}
.m{font-family:var(--mono);font-variant-numeric:tabular-nums}
.lab{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mut)}
.up{color:var(--up)}.down{color:var(--down)}

header{padding:12px 14px 10px;padding-top:calc(12px + env(safe-area-inset-top));display:flex;align-items:center;gap:10px}
.logo{font-weight:900;font-size:21px;letter-spacing:-.03em;text-transform:uppercase;line-height:1}
.logo i{font-style:normal;color:var(--acc)}
#live{display:flex;align-items:center;gap:5px;font-family:var(--mono);font-size:10px;letter-spacing:.08em;color:var(--mut);text-transform:uppercase}
#live b{width:7px;height:7px;border-radius:50%;background:var(--mut)}
#live.on{color:var(--up)}#live.on b{background:var(--up);animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.25}}
#total{margin-left:auto;text-align:right;line-height:1.15}
#total .m{font-size:17px;font-weight:600}

.tape{border-top:1px solid var(--line);border-bottom:1px solid var(--line);overflow:hidden;white-space:nowrap;background:var(--panel)}
.tapeIn{display:inline-block;padding:6px 0;animation:tape 60s linear infinite;font-family:var(--mono);font-size:12px}
.tapeIn span{margin:0 14px}.tapeIn em{font-style:normal;color:var(--mut);margin-right:6px}
@keyframes tape{to{transform:translateX(-50%)}}

main{flex:1;overflow-y:auto;padding:12px 12px 20px}
.page{display:none}.page.on{display:block}
nav{display:flex;border-top:1px solid var(--line);background:var(--panel);padding-bottom:env(safe-area-inset-bottom)}
nav button{flex:1;min-width:0;background:none;border:0;border-top:2px solid transparent;color:var(--mut);padding:9px 0 8px;font-size:10px;font-weight:700;
  text-transform:uppercase;letter-spacing:.02em;display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
nav svg{width:21px;height:21px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
nav button.on{color:var(--acc);border-top-color:var(--acc)}

.box{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:13px;margin-bottom:12px}
.box.flat{padding:0}
h2{font-size:13px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;margin:18px 2px 8px}
.note{font-size:12px;color:var(--mut);margin:8px 2px;line-height:1.45}
.tag{font-family:var(--mono);font-size:10px;letter-spacing:.08em;border:1px solid var(--acc);color:var(--acc);padding:2px 6px;border-radius:3px;text-transform:uppercase}

.pulse{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.pulse b{display:block;font-size:15px;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:5px;background:var(--down);border-radius:3px;overflow:hidden;margin-top:9px}.bar i{display:block;height:100%;background:var(--up)}

.tools{display:flex;gap:6px;margin-bottom:8px;flex-wrap:wrap}
#q{flex:1 1 130px;min-width:0;background:var(--panel);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:9px 11px;font-size:15px;outline:none}
#q:focus,input[type=number]:focus{border-color:var(--acc)}
.seg{display:flex;border:1px solid var(--line);border-radius:6px;overflow:hidden}
.seg button{background:var(--panel);border:0;border-right:1px solid var(--line);color:var(--mut);padding:0 10px;font-size:12px;font-weight:700;cursor:pointer;min-height:38px}
.seg button:last-child{border-right:0}.seg button.on{background:var(--acc);color:#111}

.row{display:flex;align-items:center;gap:10px;padding:10px 11px;border-bottom:1px solid var(--line);cursor:pointer}
.row:last-child{border-bottom:0}.row:hover{background:var(--panel2)}
.rk{width:18px;text-align:right;color:var(--mut);font-family:var(--mono);font-size:11px;flex:none}
.ico{width:28px;height:28px;border-radius:50%;background:var(--panel2);flex:none;display:flex;align-items:center;justify-content:center;
  font-family:var(--mono);font-size:9px;color:var(--mut);overflow:hidden}
.ico img{width:100%;height:100%}
.nm{flex:1;min-width:0}
.nm div{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nm small{color:var(--mut);font-family:var(--mono);font-size:11px;text-transform:uppercase}
.spark{width:56px;height:24px;flex:none}
.px{text-align:right;flex:none;min-width:96px;font-family:var(--mono);font-variant-numeric:tabular-nums}
.px div{font-weight:600;font-size:14.5px;border-radius:3px}
.px small{font-size:12px}
.fu{animation:fu .7s}.fd{animation:fd .7s}
@keyframes fu{0%{background:rgba(79,214,138,.4)}100%{background:transparent}}
@keyframes fd{0%{background:rgba(255,106,85,.4)}100%{background:transparent}}

.big{font-family:var(--mono);font-size:29px;font-weight:600;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.g3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.kv b{display:block;font-family:var(--mono);font-size:15px;font-weight:600;margin-top:2px}
.btn{border:1px solid transparent;border-radius:6px;padding:13px 10px;font-size:14px;font-weight:900;text-transform:uppercase;letter-spacing:.06em;cursor:pointer;width:100%}
.buy{background:var(--up);color:#07130c}.sell{background:transparent;border-color:var(--down);color:var(--down)}
.ghost{background:transparent;border-color:var(--line);color:var(--ink)}.gold{background:var(--acc);color:#111}
.btn:disabled{opacity:.35;cursor:default}
input[type=number]{width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:12px;
  font-family:var(--mono);font-size:17px;outline:none}
.chips{display:flex;gap:6px;margin:8px 0}
.chips button{flex:1;background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:7px 0;font-family:var(--mono);font-size:12px;cursor:pointer}

.tip{border-left:3px solid var(--acc);padding:2px 0 2px 10px;margin:10px 0;font-size:14.5px;line-height:1.45}
.tip.bad{border-color:var(--down)}.tip.good{border-color:var(--up)}

#sheet{position:fixed;inset:0;background:rgba(0,0,0,.65);display:none;align-items:flex-end;justify-content:center;z-index:10}
#sheet.on{display:flex}
#sheetIn{background:var(--panel);width:100%;max-width:600px;max-height:94%;overflow-y:auto;border:1px solid var(--line);border-bottom:0;
  border-radius:10px 10px 0 0;padding:14px 14px calc(18px + env(safe-area-inset-bottom))}
#sheetIn .top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
#sheetIn .top h3{flex:1;margin:0;font-size:18px;font-weight:900}
.x{background:transparent;border:1px solid var(--line);color:var(--ink);width:32px;height:32px;border-radius:6px;font-size:15px;cursor:pointer}
canvas{width:100%;height:150px;display:block;margin:10px 0 6px}
#toast{position:fixed;left:50%;bottom:84px;transform:translateX(-50%) translateY(16px);background:var(--ink);color:#111;padding:10px 14px;border-radius:6px;
  font-weight:700;font-size:14px;opacity:0;transition:.2s;pointer-events:none;z-index:20;max-width:90%;text-align:center}
#toast.on{opacity:1;transform:translateX(-50%)}

.less h3{margin:0 0 6px;font-size:16px;font-weight:900}
.less p{margin:0 0 10px;color:#cfc9bb;line-height:1.5;font-size:14.5px}
.less .q{font-weight:700;margin:10px 0 6px;font-size:14.5px}
.ans{display:block;width:100%;text-align:left;background:transparent;border:1px solid var(--line);color:var(--ink);border-radius:6px;
  padding:10px 12px;margin-bottom:6px;font-size:14.5px;cursor:pointer}
.ans:hover:not(:disabled){border-color:var(--mut)}
.ans.ok{border-color:var(--up);color:var(--up)}.ans.ko{border-color:var(--down);color:var(--down)}
.done{color:var(--up);font-family:var(--mono);font-size:11px;letter-spacing:.08em;float:right}
.empty{text-align:center;color:var(--mut);padding:24px 10px;line-height:1.5}
.del{background:none;border:0;color:var(--mut);font-size:15px;cursor:pointer;padding:6px 8px}
.hist{font-size:13.5px;display:flex;justify-content:space-between;gap:8px;padding:8px 0;border-bottom:1px solid var(--line)}
.hist:last-child{border:0}.hist small{color:var(--mut);font-family:var(--mono);font-size:11px}
.fld{display:block;width:100%;background:var(--bg);border:1px solid var(--line);color:var(--ink);border-radius:6px;padding:12px;font-size:16px;outline:none;margin-bottom:8px}
.fld:focus{border-color:var(--acc)}
.chk{display:flex;gap:9px;align-items:flex-start;font-size:14px;line-height:1.4;margin:6px 0 10px;cursor:pointer}
.chk input{width:18px;height:18px;margin:1px 0 0;accent-color:var(--acc);flex:none}
.lnk{background:none;border:0;color:var(--acc);font-size:14px;padding:8px 0;cursor:pointer;text-decoration:underline}
a{color:var(--acc)}
#acMsg{font-size:14px;line-height:1.45;margin-top:8px}#acMsg.bad{color:var(--down)}#acMsg.good{color:var(--up)}
.perk{display:flex;gap:10px;padding:7px 0;font-size:14.5px;line-height:1.4}.perk b{color:var(--acc);font-family:var(--mono);flex:none}
.price{font-family:var(--mono);font-size:26px;font-weight:600}.price small{font-size:13px;color:var(--mut)}
#proTag{display:none;margin-left:6px;vertical-align:middle}
.learn p{margin:8px 0 0;font-size:14px;line-height:1.5;color:#cfc9bb}
.mis{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--line)}.mis:last-child{border:0}
.mis .st{width:20px;height:20px;border:1.5px solid var(--mut);border-radius:4px;flex:none;margin-top:1px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#111}
.mis.ok .st{background:var(--up);border-color:var(--up)}
.mis b{display:block;font-size:14.5px}.mis span{font-size:13.5px;color:var(--mut);line-height:1.4}
details.lx{border-bottom:1px solid var(--line);padding:9px 0}details.lx:last-child{border:0}
details.lx summary{cursor:pointer;font-weight:700;font-size:14.5px;list-style:none}
details.lx summary::before{content:'+ ';color:var(--acc);font-family:var(--mono)}
details.lx[open] summary::before{content:'– '}
details.lx p{margin:6px 0 0;font-size:14px;line-height:1.5;color:#cfc9bb}
.prog{height:4px;background:var(--line);border-radius:2px;overflow:hidden;margin-top:8px}.prog i{display:block;height:100%;background:var(--acc)}
</style>
</head>
<body>
<header>
  <div>
    <div class="logo">Crypto<i>/</i>Sim<span class="tag" id="proTag">Pro</span></div>

  <button data-tab="wallet"><svg viewBox="0 0 24 24"><rect x="3" y="6" width="18" height="13" rx="2"/><path d="M3 10h18M16 15h2"/></svg>Portefeuille</button>

</nav>

<div id="sheet"><div id="sheetIn"></div></div>

<script src="config.js"></script>
<script>
'use strict';
/* ================== RÉGLAGES ================== */
const START_CASH = 10000;      // euros fictifs au départ
const FEE = 0.002;             // frais de 0,2 % par achat/vente
const REFRESH_MS = 60000;      // liste complète rechargée toutes les 60 s
const LESSON_BONUS = 100;      // euros fictifs par quiz de leçon réussi du premier coup
const FLASH_BONUS = 10;        // euros fictifs par bonne réponse au quiz éclair (1 fois par jour)
const API = 'https://api.coingecko.com/api/v3/coins/markets?vs_currency=eur&order=market_cap_desc&per_page=40&page=1&sparkline=true&price_change_percentage=24h';
const LIVE_WS = 'wss://data-stream.binance.vision/ws/!miniTicker@arr';   // prix en direct (toutes les secondes)

/* ================== SAUVEGARDE ================== */
const KEY = 'cs_state_v1', KEY_M = 'cs_market_v1';
function fresh(){ return {cash:START_CASH, pos:{}, hist:[], alerts:[], lessons:{}, missions:{}, bonus:0, fees:0, btc0:0, qDay:'', u:0}; }
let S = fresh();
try { const r = JSON.parse(localStorage.getItem(KEY)); if (r && typeof r.cash === 'number') S = Object.assign(fresh(), r); } catch(e){}
function save(){ S.u = Date.now(); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} cloudSave(); checkMissions(); }

/* ================== COMPTES (Supabase) ================== */
const CFG = window.CS_CONFIG || {};
const CLOUD = !!(CFG.supabaseUrl && CFG.supabaseKey);
const SB_LIB = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.115.0/dist/umd/supabase.js';
let sb = null, sbFail = false, user = null, prof = null, cloudAlerts = null, cloudT = null;
let authMode = 'login', recovery = false, delArmed = false;
let seen = {}; try { seen = JSON.parse(localStorage.getItem('cs_seen')) || {}; } catch(e){}

let coins = [], lastUpd = 0;
try { const m = JSON.parse(localStorage.getItem(KEY_M)); if (m && Array.isArray(m.coins)) { coins = m.coins.map(c => Object.assign(c, {live:[], isLive:false, ref:c.ref || c.current_price})); lastUpd = m.t; } } catch(e){}

/* ================== OUTILS ================== */
const $ = s => document.querySelector(s);
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function eur(v){
  if (!isFinite(v)) return '—';
  const a = Math.abs(v), d = a >= 1 ? 2 : a >= 0.01 ? 4 : 6;
  return v.toLocaleString('fr-FR', {minimumFractionDigits: 2, maximumFractionDigits: d}) + ' €';
}
function sgn(v){ return (v >= 0 ? '+' : '') + eur(v); }
function pct(v){ if (!isFinite(v)) return '—'; return (v >= 0 ? '+' : '') + v.toFixed(2).replace('.', ',') + ' %'; }
function qtyFmt(q){ return q.toLocaleString('fr-FR', {maximumFractionDigits: q >= 100 ? 2 : q >= 1 ? 4 : 8}); }
function cls(v){ return v >= 0 ? 'up' : 'down'; }
function coin(id){ return coins.find(c => c.id === id); }
function price(id){ const c = coin(id); return c ? c.current_price : 0; }
function today(){ return new Date().toISOString().slice(0, 10); }
let toastT;
function toast(msg){ const t = $('#toast'); t.textContent = msg; t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), 2800); }
function icon(c){
  const img = /^https:\/\//.test(c.image || '') ? `<img src="${esc(c.image)}" alt="" loading="lazy" onerror="this.remove()">` : '';
  return `<div class="ico">${img || esc((c.symbol || '?').slice(0,4).toUpperCase())}</div>`;
}
function sparkSvg(arr, up){
  if (!arr || arr.length < 2) return '<svg class="spark"></svg>';
  const step = Math.max(1, Math.floor(arr.length / 28)), pts = [];
  for (let i = 0; i < arr.length; i += step) pts.push(arr[i]);
  pts.push(arr[arr.length - 1]);
  const mn = Math.min(...pts), mx = Math.max(...pts), r = (mx - mn) || 1;
  const d = pts.map((v, i) => (i * 56 / (pts.length - 1)).toFixed(1) + ',' + (22 - (v - mn) / r * 20).toFixed(1)).join(' ');
  return `<svg class="spark" viewBox="0 0 56 24"><polyline points="${d}" fill="none" stroke="${up ? '#4fd68a' : '#ff6a55'}" stroke-width="1.4" stroke-linejoin="round"/></svg>`;
}

/* ================== CALCULS ================== */
function holdingsValue(){ let v = 0; for (const id in S.pos) v += S.pos[id].qty * price(id); return v; }
function totalValue(){ return S.cash + holdingsValue(); }
function baseline(){ return START_CASH + S.bonus; }

function buy(id, amt){
  const p = price(id);
  if (!p) return toast('Prix indisponible, réessaie.');
  if (!(amt > 0)) return toast('Écris un montant en euros.');
  if (amt > S.cash + 1e-9) return toast("Pas assez d'euros : il te reste " + eur(S.cash));
  amt = Math.min(amt, S.cash);
  const q = amt * (1 - FEE) / p;
  const pos = S.pos[id] || (S.pos[id] = {qty:0, cost:0, t0: Date.now()});
  pos.qty += q; pos.cost += amt; S.cash -= amt; S.fees += amt * FEE;
  log('A', id, q, p, amt);
  toast('Acheté ' + qtyFmt(q) + ' ' + coin(id).symbol.toUpperCase() + ' à ' + eur(p));
  return true;
}
function sell(id, amt, all){
  const p = price(id), pos = S.pos[id];
  if (!p) return toast('Prix indisponible, réessaie.');
  if (!pos || pos.qty <= 0) return toast("Tu n'en as pas.");
  let q = all ? pos.qty : amt / p;
  if (!(q > 0)) return toast('Écris un montant en euros.');
  if (q > pos.qty) q = pos.qty;
  const got = q * p * (1 - FEE), gain = got - pos.cost * (q / pos.qty);
  pos.cost *= (1 - q / pos.qty); pos.qty -= q; S.cash += got; S.fees += q * p * FEE;
  if (gain > 0) S.gainSale = 1;
  if (pos.qty * p < 0.01) delete S.pos[id];
  log('V', id, q, p, got);
  toast('Vendu pour ' + eur(got) + ' (' + sgn(gain) + ')');
  return true;
}
function log(type, id, q, p, amt){
  S.hist.unshift({t: Date.now(), type, id, sym: coin(id).symbol.toUpperCase(), q, p, amt});
  if (S.hist.length > 100) S.hist.length = 100;
  save();
}

/* ================== MARCHÉ (liste complète, toutes les 60 s) ================== */
let bySym = {};
async function loadMarket(){
  try {
    const r = await fetch(API, {cache: 'no-store'});
    if (!r.ok) throw new Error('HTTP ' + r.status);
    const d = await r.json();
    if (!Array.isArray(d) || !d.length) throw new Error('vide');
    const old = {}; coins.forEach(c => old[c.id] = c);
    const liveOk = Date.now() - lastLive < 15000;
    coins = d.filter(c => c && c.id && typeof c.current_price === 'number').map(c => {
      const o = old[c.id], keep = o && o.isLive && liveOk;
      return { id: c.id, symbol: String(c.symbol || ''), name: String(c.name || c.id), image: c.image,
        ref: c.current_price,
        current_price: keep ? o.current_price : c.current_price, cap: +c.market_cap || 0,
        ch: keep ? o.ch : (+c.price_change_percentage_24h || 0),
        spark: (c.sparkline_in_7d && c.sparkline_in_7d.price) || [],
        live: o ? o.live : [], isLive: !!keep };
    });
    bySym = {};
    coins.forEach(c => { const k = c.symbol.toUpperCase() + 'USDT'; if (!bySym[k]) bySym[k] = c; });
    lastUpd = Date.now();
    try { localStorage.setItem(KEY_M, JSON.stringify({t: lastUpd, coins: coins.map(c => ({id:c.id, symbol:c.symbol, name:c.name, image:c.image, ref:c.ref, current_price:c.current_price, ch:c.ch, cap:c.cap, spark:c.spark}))})); } catch(e){}
    if (!S.btc0 && price('bitcoin')) { S.btc0 = price('bitcoin'); try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }   // sans changer S.u
    checkAlerts();
  } catch(e) {
    if (!coins.length) $('#list').innerHTML = '<div class="empty">Pas de connexion.<br>Vérifie Internet, ça réessaie tout seul.</div>';
  }
  renderAll();
}

/* ================== PRIX EN DIRECT ================== */
let ws = null, lastLive = 0, eurusd = 0, wsDelay = 1500;
const dirty = new Set();
function connectLive(){
  if (!('WebSocket' in window)) return;
  try { ws = new WebSocket(LIVE_WS); } catch(e) { return; }
  ws.onmessage = ev => {
    let arr; try { arr = JSON.parse(ev.data); } catch(e) { return; }
    if (!Array.isArray(arr)) return;
    wsDelay = 1500;
    for (const t of arr) if (t.s === 'EURUSDT' && +t.c > 0.5) eurusd = +t.c;
    if (!eurusd) {                       // en attendant le vrai taux : on le déduit du Bitcoin
      const b = arr.find(t => t.s === 'BTCUSDT'), bc = coin('bitcoin');
      if (b && bc && bc.ref) eurusd = +b.c / bc.ref;
    }
    if (!eurusd) return;
    for (const t of arr) {
      const c = bySym[t.s]; if (!c) continue;
      const p = +t.c / eurusd, o = +t.o;
      if (!(p > 0) || Math.abs(p / c.ref - 1) > 0.08) continue;   // sécurité : pas la même crypto ou prix bizarre
      if (p !== c.current_price) { c.dir = p > c.current_price ? 1 : -1; dirty.add(c.id); }
      c.current_price = p; c.isLive = true;
      if (o > 0) c.ch = (+t.c - o) / o * 100;
    }
    lastLive = Date.now();
  };
  ws.onclose = () => { ws = null; setTimeout(connectLive, wsDelay); wsDelay = Math.min(wsDelay * 2, 30000); };
  ws.onerror = () => { try { ws.close(); } catch(e){} };
}
function flash(el, dir){ if (!el) return; el.classList.remove('fu', 'fd'); void el.offsetWidth; el.classList.add(dir > 0 ? 'fu' : 'fd'); }
function tick(){
  const on = Date.now() - lastLive < 8000, L = $('#live');
  L.classList.toggle('on', on); L.lastElementChild.textContent = on ? 'en direct' : (coins.length ? 'prix différés' : 'connexion');
  if (!dirty.size) return;
  for (const id of dirty) {
    const c = coin(id); if (!c) continue;
    c.live.push(c.current_price); if (c.live.length > 300) c.live.shift();
    const row = document.querySelector('#list [data-coin="' + id + '"]');
    if (row) {
      const p = row.querySelector('.px div'), s = row.querySelector('.px small');
      p.textContent = eur(c.current_price); flash(p, c.dir);
      s.textContent = pct(c.ch); s.className = cls(c.ch);
    }
    document.querySelectorAll('[data-t="' + id + '"]').forEach(e => { e.lastChild.textContent = eur(c.current_price); e.className = cls(c.ch); });
  }
  const openDirty = openId && dirty.has(openId);
  dirty.clear();
  renderTotal(); renderPulse(); checkAlerts();
  if ($('#p-wallet').classList.contains('on')) renderWallet();
  if (openDirty) sheetLive(true);
}

const view = {q: '', sort: 'top'};
function renderPulse(){
  if (!coins.length) return;
  const real = coins.filter(c => Math.abs(c.ch) > 0.05 || c.current_price > 2 || c.current_price < 0.8);   // on ignore les stablecoins
  const ups = real.filter(c => c.ch >= 0).length, share = ups / (real.length || 1);
  const best = real.reduce((a, b) => b.ch > a.ch ? b : a, real[0]), worst = real.reduce((a, b) => b.ch < a.ch ? b : a, real[0]);
  const mood = share >= .7 ? 'Euphorie' : share >= .55 ? 'Plutôt vert' : share > .45 ? 'Indécis' : share > .3 ? 'Plutôt rouge' : 'Ça saigne';

}

/* ================== LE COACH (analyse ton portefeuille) ================== */
function coach(){
  const tips = [], tot = totalValue(), ids = Object.keys(S.pos);
  if (!ids.length && !S.hist.length) return [{k:'', t:"Commence petit : mets 500 € sur une grosse crypto et regarde comment ça bouge pendant une heure."}];
  let top = null;
  for (const id of ids) { const v = S.pos[id].qty * price(id); if (!top || v > top.v) top = {id, v}; }
  if (top && top.v / tot > 0.6) { const c = coin(top.id);
    tips.push({k:'bad', t:`${Math.round(top.v / tot * 100)} % de ton portefeuille est sur ${c ? c.name : top.id}. Si ça chute de 20 %, tu perds ${eur(top.v * 0.2)} d'un coup.`}); }
  const day = S.hist.filter(h => Date.now() - h.t < 864e5).length;
  if (day >= 8) tips.push({k:'bad', t:`${day} opérations en 24 h. Chaque aller-retour te coûte 0,4 % : tu as déjà laissé ${eur(S.fees)} en frais.`});
  for (const id of ids) {
    const p = S.pos[id], v = p.qty * price(id), g = (v / p.cost - 1) * 100, c = coin(id); if (!c || !p.cost) continue;
    if (g <= -15) tips.push({k:'bad', t:`${c.name} est à ${pct(g)} depuis ton achat. La bonne question : est-ce que tu l'achèterais encore aujourd'hui ?`});
    else if (g >= 20) tips.push({k:'good', t:`${c.name} est à ${pct(g)}. Tant que tu n'as pas vendu, ce gain n'existe que sur le papier.`});
  }
  if (ids.length && S.cash / tot < 0.03) tips.push({k:'', t:"Tu n'as presque plus d'euros de côté. Si le marché baisse, tu ne pourras pas en profiter pour acheter moins cher."});
  if (ids.length >= 4 && !(top && top.v / tot > 0.6)) tips.push({k:'good', t:`Ton argent est réparti sur ${ids.length} cryptos : c'est plus solide qu'un seul gros pari.`});
  if (S.btc0 && S.hist.length && price('bitcoin')) {
    const me = (tot / baseline() - 1) * 100, btc = (price('bitcoin') / S.btc0 - 1) * 100;
    tips.push({k: me >= btc ? 'good' : '', t:`Toi : ${pct(me)}. Quelqu'un qui aurait juste gardé du Bitcoin depuis ton arrivée : ${pct(btc)}.`});
  }
  return tips.slice(0, 3);
}

function isPro(){ return !!(prof && prof.premium_until && new Date(prof.premium_until) > new Date()); }
function myAlerts(){ return user ? (cloudAlerts || []) : S.alerts; }
function alertMax(){ return user ? (isPro() ? (CFG.proAlerts || 30) : (CFG.freeAlerts || 5)) : 20; }
function fromRow(r){ return {k: r.id, id: r.coin_id, dir: r.dir, target: r.target, email: r.email, done: r.done || !!seen[r.id]}; }
async function addAlert(id, target, byMail){
  const p = price(id), c = coin(id);
  if (!(target > 0)) { toast('Écris un prix.'); return false; }
  if (!p || !c) { toast('Prix indisponible.'); return false; }
  const dir = target >= p ? 'up' : 'down';
  if (myAlerts().filter(a => !a.done).length >= alertMax()) {
    toast(user && !isPro() ? `Limite de ${alertMax()} alertes en gratuit. En Pro : ${CFG.proAlerts || 30}.` : "Tu as atteint le nombre maximum d'alertes.");
    return false;
  }
  const mail = !!byMail && isPro();
  if (user) {
    if (!cloudAlerts) { toast('Connexion au compte en cours, réessaie.'); return false; }
    const {data, error} = await sb.from('alerts').insert({coin_id: id, symbol: c.symbol, name: c.name, dir, target, email: mail}).select().single();
    if (error) { toast(/LIMITE/.test(error.message) ? "Limite d'alertes atteinte." : 'Erreur : ' + error.message); return false; }
    cloudAlerts.push(fromRow(data));
  } else {
    S.alerts.push({k: Date.now() + '' + Math.floor(Math.random() * 1000), id, dir, target, done: false});
    save();
  }
  if ('Notification' in window && Notification.permission === 'default') { try { Notification.requestPermission(); } catch(e){} }
  S.madeAlert = 1; save();
  toast(mail ? 'Alerte créée : tu recevras aussi un e-mail' : 'Alerte enregistrée');
  return true;
}
async function deleteAlert(k){
  if (user) {
    const {error} = await sb.from('alerts').delete().eq('id', k);
    if (error) return toast('Erreur : ' + error.message);
    cloudAlerts = (cloudAlerts || []).filter(a => a.k !== k);
  } else { S.alerts = S.alerts.filter(a => a.k !== k); save(); }
  renderAlerts();
}
function checkAlerts(){
  let hit = false;
  for (const a of myAlerts()) {
    if (a.done) continue;
    const p = price(a.id); if (!p) continue;
    if ((a.dir === 'up' && p >= a.target) || (a.dir === 'down' && p <= a.target)) {
      a.done = true; a.at = Date.now(); hit = true;
      if (user) { seen[a.k] = 1; try { localStorage.setItem('cs_seen', JSON.stringify(seen)); } catch(e){} }
      const c = coin(a.id), msg = `${c.name} est ${a.dir === 'up' ? 'passé au-dessus de' : 'passé sous'} ${eur(a.target)} (maintenant ${eur(p)})`;
      toast('Alerte : ' + msg);
      try { if ('Notification' in window && Notification.permission === 'granted') new Notification('CryptoSim', {body: msg}); } catch(e){}
      try { navigator.vibrate && navigator.vibrate([120, 60, 120]); } catch(e){}
    }
  }
  if (hit) { save(); renderAlerts(); }
}
function renderAlerts(){
  const L = myAlerts(), pend = L.filter(a => !a.done).length;
  let h = `<h2 style="margin-top:4px">Mes alertes de prix <span class="lab" style="float:right">${pend} / ${alertMax()}</span></h2>`;
  if (user && !cloudAlerts) h += '<div class="box empty">Chargement de tes alertes…</div>';
  else if (!L.length) h += `<div class="box empty">Aucune alerte.<br>Touche une crypto dans Marché, puis descends jusqu'à « Alerte de prix ».</div>`;
  else h += '<div class="box flat">' + L.map(a => {
    const c = coin(a.id) || {id:a.id, symbol:a.id, name:a.id};
    return `<div class="row" style="cursor:default">${icon(c)}
      <div class="nm"><div>${esc(c.name)} ${a.dir === 'up' ? 'au-dessus de' : 'sous'} <span class="m">${eur(a.target)}</span></div>
      <small style="text-transform:none" class="${a.done ? 'up' : ''}">${a.done ? 'Déclenchée' : 'En attente'}${a.email ? ' · par e-mail' : ''}</small></div>
      <button class="del" data-del="${esc(a.k)}" aria-label="Supprimer">✕</button></div>`;
  }).join('') + '</div>';
  h += '<p class="note">Les alertes sont surveillées en direct tant que le site est ouvert.' +
    (isPro() ? ' Celles « par e-mail » sont aussi surveillées site fermé.' : CLOUD ? ' Avec CryptoSim Pro, tu les reçois aussi par e-mail, même site fermé.' : '') + '</p>';
  $('#p-alerts').innerHTML = h;
}

function isStable(c){ return /^(tether|usd-coin|dai|usds|ethena-usde|first-digital-usd|paypal-usd|true-usd|usd1-wlfi)$/.test(c.id) || /usd/i.test(c.symbol || ''); }
function capFmt(v){
  if (v >= 1e9) return (v / 1e9).toLocaleString('fr-FR', {maximumFractionDigits: v >= 1e11 ? 0 : 1}) + ' milliards €';
  return (v / 1e6).toLocaleString('fr-FR', {maximumFractionDigits: 0}) + ' millions €';
}
function insightHtml(c){
  const out = [], a = c.spark || [];
  const fact = FACTS[c.id] || (isStable(c) ? "Un stablecoin : il est fait pour garder une valeur fixe, en général 1 dollar." : '');
  if (fact) out.push(esc(fact));

function sheetLive(doFlash){
  const c = coin(openId); if (!c || !$('#sP')) return;
  $('#sP').textContent = eur(c.current_price); if (doFlash) flash($('#sP'), c.dir);
  $('#sC').textContent = pct(c.ch) + ' sur 24 h'; $('#sC').className = 'm ' + cls(c.ch);
  $('#sOwn').innerHTML = ownHtml(c);
  if (chartMode === 'live') drawChart(c);
}
function drawChart(c){
  const cv = $('#chart'); if (!cv || !c) return;
  const dpr = window.devicePixelRatio || 1, w = cv.clientWidth, h = cv.clientHeight;
  cv.width = w * dpr; cv.height = h * dpr;
  const g = cv.getContext('2d'); g.scale(dpr, dpr);
  const a = chartMode === 'live' ? c.live : (c.spark || []);
  g.font = '12px IBM Plex Mono, monospace';
  if (a.length < 2) { g.fillStyle = '#89958c'; g.fillText(chartMode === 'live' ? 'En attente des prochains prix en direct…' : 'Graphique indisponible', 4, h / 2); return; }
  const mn = Math.min(...a), mx = Math.max(...a), r = (mx - mn) || mx * 0.001 || 1, up = a[a.length - 1] >= a[0];
  const X = i => i * (w - 6) / (a.length - 1), Y = v => 10 + (1 - (v - mn) / r) * (h - 20);
  g.strokeStyle = '#26312b'; g.lineWidth = 1;
  for (let k = 0; k <= 3; k++) { const y = 10 + k * (h - 20) / 3; g.beginPath(); g.moveTo(0, y); g.lineTo(w, y); g.stroke(); }
  g.beginPath(); a.forEach((v, i) => i ? g.lineTo(X(i), Y(v)) : g.moveTo(X(i), Y(v)));
  g.strokeStyle = up ? '#4fd68a' : '#ff6a55'; g.lineWidth = 1.8; g.lineJoin = 'round'; g.stroke();
  g.fillStyle = g.strokeStyle; g.beginPath(); g.arc(X(a.length - 1), Y(a[a.length - 1]), 3.2, 0, 7); g.fill();
}

/* ================== COMPTE : CONNEXION, ABONNEMENT ================== */
let accMsgState = null;
function siteUrl(){ return location.origin + location.pathname; }
function frErr(e){
  const m = String((e && e.message) || e || '');
  if (/invalid login credentials/i.test(m)) return 'E-mail ou mot de passe incorrect.';
  if (/email not confirmed/i.test(m)) return "Confirme d'abord ton e-mail : clique sur le lien reçu (regarde aussi les spams).";
  if (/already registered|already exists/i.test(m)) return 'Un compte existe déjà avec cet e-mail.';
  if (/rate limit|too many|security purposes/i.test(m)) return 'Trop de tentatives. Attends une minute et réessaie.';
  if (/password/i.test(m) && /(weak|short|least|characters)/i.test(m)) return 'Mot de passe trop faible : au moins 8 caractères, mélange lettres et chiffres.';
  if (/failed to fetch|network/i.test(m)) return 'Pas de connexion au serveur. Vérifie Internet.';
  return 'Erreur : ' + m;
}
function accMsg(txt, good){
  accMsgState = {txt, good};
  const el = $('#acMsg'); if (el) { el.textContent = txt; el.className = good ? 'good' : 'bad'; }
}
function initCloud(){
  if (!CLOUD) return;
  const s = document.createElement('script');
  s.src = SB_LIB;
  s.onload = () => {
    try { sb = window.supabase.createClient(CFG.supabaseUrl, CFG.supabaseKey); } catch(e) { sbFail = true; return renderAccount(); }
    sb.auth.onAuthStateChange((ev, session) => {
      if (ev === 'PASSWORD_RECOVERY') { recovery = true; setTimeout(() => showTab('account'), 0); }
      const u = (session && session.user) || null;
      if ((u && u.id) !== (user && user.id)) { user = u; setTimeout(onUser, 0); }
      else { user = u; setTimeout(renderAccount, 0); }
    });
    renderAccount();
  };
  s.onerror = () => { sbFail = true; renderAccount(); };
  document.head.appendChild(s);
}
async function onUser(){
  prof = null; cloudAlerts = null; delArmed = false; accMsgState = null;
  if (!user) { renderAll(); return; }
  renderAll();
  await loadProfile(true);
  await loadCloudAlerts();
  const old = S.alerts.filter(a => !a.done);            // alertes faites avant de se connecter -> sur le compte
  if (old.length && cloudAlerts) {
    for (const a of old) {
      const c = coin(a.id); if (!c) continue;
      const {data, error} = await sb.from('alerts').insert({coin_id: a.id, symbol: c.symbol, name: c.name, dir: a.dir, target: a.target, email: false}).select().single();
      if (!error && data) cloudAlerts.push(fromRow(data));
    }
    S.alerts = []; save();
  }
  if (/[?&]pro=ok/.test(location.search)) {
    history.replaceState(null, '', siteUrl());
    toast('Merci ! Ton abonnement Pro s\'active…');
    for (let i = 0; i < 8 && !isPro(); i++) { await new Promise(r => setTimeout(r, 4000)); await loadProfile(false); }
    toast(isPro() ? 'CryptoSim Pro est activé.' : "Le paiement est en cours de validation, ça peut prendre quelques minutes.");
  }
  renderAll();
}
async function loadProfile(merge){
  if (!user) return;
  const {data, error} = await sb.from('profiles').select('state,premium_until,updated_at').eq('id', user.id).maybeSingle();
  if (error || !data) return;
  const wasPro = isPro();
  prof = data;
  if (merge) {
    const r = data.state;
    const blank = !S.hist.length && !Object.keys(S.lessons).length && !S.bonus;   // rien joué sur cet appareil
    if (r && typeof r.cash === 'number' && (blank || (r.u || 0) > (S.u || 0))) {
      S = Object.assign(fresh(), r, {alerts: []});
      try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){}
      toast('Partie récupérée depuis ton compte');
    } else cloudSave(true);
  }
  if (wasPro !== isPro()) renderAll();
}
async function loadCloudAlerts(){
  if (!user) return;
  const {data, error} = await sb.from('alerts').select('id,coin_id,dir,target,email,done').order('created_at');
  if (!error && data) { cloudAlerts = data.map(fromRow); renderAlerts(); }
}
function cloudSave(now){
  if (!user || !sb) return;
  clearTimeout(cloudT);
  cloudT = setTimeout(() => {
    sb.from('profiles').update({state: Object.assign({}, S, {alerts: []}), updated_at: new Date().toISOString()}).eq('id', user.id)
      .then(r => { if (r && r.error) console.warn('sauvegarde compte', r.error.message); });
  }, now ? 0 : 2500);
}
async function submitAccount(){
  if (!sb) return;
  const em = ($('#acEmail') || {}).value, pw = ($('#acPass') || {}).value || '';
  const btn = $('#acGo'); if (btn) btn.disabled = true;
  let r;
  try {
    if (recovery) {
      if (pw.length < 8) return accMsg('Le mot de passe doit faire au moins 8 caractères.');
      r = await sb.auth.updateUser({password: pw});
      if (r.error) return accMsg(frErr(r.error));
      recovery = false; accMsgState = null; toast('Mot de passe changé.'); return renderAccount();
    }
    const email = String(em || '').trim();
    if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) return accMsg('Cet e-mail ne semble pas valide.');
    if (authMode !== 'forgot' && pw.length < 8) return accMsg('Le mot de passe doit faire au moins 8 caractères.');
    if (authMode === 'signup' && !($('#acOk') || {}).checked) return accMsg('Coche la case pour accepter les conditions.');
    if (authMode === 'login') r = await sb.auth.signInWithPassword({email, password: pw});
    else if (authMode === 'signup') r = await sb.auth.signUp({email, password: pw, options: {emailRedirectTo: siteUrl()}});
    else r = await sb.auth.resetPasswordForEmail(email, {redirectTo: siteUrl()});
    if (r.error) return accMsg(frErr(r.error));
    if (authMode === 'signup' && !(r.data && r.data.session)) accMsg("Compte créé. Clique sur le lien qu'on vient de t'envoyer par e-mail pour l'activer (regarde aussi les spams).", true);
    else if (authMode === 'forgot') accMsg('Si un compte existe avec cet e-mail, tu vas recevoir un lien pour choisir un nouveau mot de passe.', true);
  } catch(e) { accMsg(frErr(e)); }
  finally { const b = $('#acGo'); if (b) b.disabled = false; }
}
async function accountClick(t){
  const mode = t.closest('[data-am]');
  if (mode) { authMode = mode.dataset.am; accMsgState = null; return renderAccount(); }
  if (t.id === 'acOut') { await sb.auth.signOut(); toast('Déconnecté.'); return; }
  if (t.id === 'acDel') {
    if (!delArmed) { delArmed = true; renderAccount(); setTimeout(() => { delArmed = false; }, 6000); return; }
    t.disabled = true;
    const {error} = await sb.functions.invoke('delete-account', {method: 'POST'});
    if (error) { t.disabled = false; return toast('Suppression impossible pour le moment. Réessaie plus tard.'); }
    await sb.auth.signOut();
    S = fresh(); S.btc0 = price('bitcoin'); save(); renderAll();
    toast('Ton compte et toutes ses données ont été supprimés.');
  }
}

function perks(){

  } else if (!user) {

    h = `<h2 style="margin-top:4px">${forgot ? 'Mot de passe oublié' : sign ? 'Créer un compte' : 'Connexion'}</h2>

        ${forgot ? '' : `<div class="seg" style="margin-bottom:12px"><button type="button" data-am="login" class="${sign ? '' : 'on'}" style="flex:1">Connexion</button><button type="button" data-am="signup" class="${sign ? 'on' : ''}" style="flex:1">Créer un compte</button></div>`}
        <input class="fld" id="acEmail" type="email" autocomplete="email" inputmode="email" placeholder="Ton e-mail">
        ${forgot ? '' : `<input class="fld" id="acPass" type="password" autocomplete="${sign ? 'new-password' : 'current-password'}" placeholder="${sign ? 'Choisis un mot de passe (8 caractères min.)' : 'Mot de passe'}">`}
        ${sign ? `<label class="chk"><input type="checkbox" id="acOk"> <span>J'accepte les <a href="legal.html" target="_blank">conditions et la politique de confidentialité</a>. Si j'ai moins de 15 ans, un parent est d'accord.</span></label>` : ''}
        <button class="btn gold" id="acGo" type="submit">${forgot ? 'Recevoir le lien' : sign ? 'Créer mon compte' : 'Me connecter'}</button>
        ${forgot ? '<button type="button" class="lnk" data-am="login">Retour à la connexion</button>' : sign ? '' : '<button type="button" class="lnk" data-am="forgot">Mot de passe oublié ?</button>'}
        <div id="acMsg"></div>
      </form>
      <h2>Avec un compte</h2><div class="box">

  } else {

    h = `<h2 style="margin-top:4px">Mon compte</h2><div class="box">

        ${portalLink() ? `<a class="btn ghost" style="display:block;text-align:center;text-decoration:none" href="${esc(portalLink())}">Gérer ou résilier</a>` : ''}</div>`;
    else h += `<h2>CryptoSim Pro</h2><div class="box">

  if (accMsgState) accMsg(accMsgState.txt, accMsgState.good);

document.addEventListener('submit', e => { if (e.target.id === 'acForm') { e.preventDefault(); submitAccount(); } });

/* ================== AFFICHAGE GÉNÉRAL ================== */
function renderAll(){
  renderTotal(); renderMarket(); renderWallet(); renderAlerts(); renderLearn(); renderAccount();
  if (openId) sheetLive(false);
}
function showTab(t){
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('on', p.id === 'p-' + t));
  document.querySelectorAll('nav button').forEach(b => b.classList.toggle('on', b.dataset.tab === t));
  if (t === 'wallet') renderWallet();
  $('main').scrollTop = 0;
}

/* ================== CLICS ================== */
document.addEventListener('click', e => {
  const t = e.target;
  const tab = t.closest('nav button'); if (tab) return showTab(tab.dataset.tab);
  if (t.id === 'sheet' || t.id === 'close') return closeSheet();
  const so = t.closest('[data-sort]');
  if (so) { view.sort = so.dataset.sort; document.querySelectorAll('#sort button').forEach(b => b.classList.toggle('on', b === so)); return renderMarket(); }
  const cm = t.closest('[data-cm]');
  if (cm) { chartMode = cm.dataset.cm; document.querySelectorAll('[data-cm]').forEach(b => b.classList.toggle('on', b === cm)); return drawChart(coin(openId)); }
  const del = t.closest('[data-del]');
  if (del) return deleteAlert(del.dataset.del);
  const go = t.closest('[data-go]'); if (go) { closeSheet(); return showTab(go.dataset.go); }
  if (t.closest('#p-account')) return accountClick(t);
  const ans = t.closest('.ans'); if (ans) return answer(ans);
  if (t.id === 'qzGo') return startQuiz();
  if (t.id === 'qzNext') return quizNext();
  const vf = t.closest('[data-vf]'); if (vf) return quizAnswer(vf.dataset.vf === '1');
  if (t.id === 'reset') {
    if (resetArmed) { resetArmed = false; S = fresh(); S.btc0 = price('bitcoin'); save(); renderAll(); toast('Nouveau départ : ' + eur(START_CASH)); }
    else { resetArmed = true; renderWallet(); setTimeout(() => { resetArmed = false; }, 5000); }
    return;
  }
  const chip = t.closest('[data-amt]');
  if (chip) { $('#amt').value = chip.dataset.amt === 'max' ? Math.floor(S.cash * 100) / 100 : chip.dataset.amt; return preview(); }
  if (t.id === 'introOk') { S.introDone = 1; save(); return renderMarket(); }
  if (openId && /^b(Buy|Sell|All|Al)$/.test(t.id)) {
    const amt = parseFloat($('#amt').value);
    if (t.id === 'bAl') {
      addAlert(openId, parseFloat($('#alp').value), $('#alMail') && $('#alMail').checked).then(ok => { if (ok) { if ($('#alp')) $('#alp').value = ''; renderAlerts(); } });
      return;
    }
    const ok = t.id === 'bBuy' ? buy(openId, amt) : t.id === 'bSell' ? sell(openId, amt, false) : sell(openId, 0, true);
    if (ok) { renderAll(); drawSheet(); }
    return;
  }
  const row = t.closest('[data-coin]'); if (row) openSheet(row.dataset.coin);
});
